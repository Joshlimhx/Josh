name: Update macro dashboard data

on:
  schedule:
    # 21:00 UTC daily — after US market close and after Japan's next
    # business day's JGB curve (jgbcme.csv) has posted.
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas openpyxl xlrd

      - name: Fetch latest data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit updated data.json
        run: |
          git config user.name "macro-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
