name: Update macro dashboard data

on:
  schedule:
    # every 3 hours (markets move intraday; FRED series only change at their own cadence)
    # (old note: 21:00 UTC daily — after US market close and after Japan's next
    # business day's JGB curve (jgbcme.csv) has posted.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas openpyxl xlrd

      - name: Fetch latest data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Check for new DANGER readings
        run: |
          npm install --no-save playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          (python -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          node scripts/check_alerts.js || echo "alert check failed (non-fatal)"

      - name: Open alert issue if something newly hit DANGER
        run: |
          if [ -s alert_body.md ]; then
            gh issue create --title "DANGER: new red-zone reading $(date -u +%Y-%m-%d\ %H:%M) UTC" --body-file alert_body.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit updated data files
        run: |
          git config user.name "macro-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if [ -f alert_state.json ]; then git add alert_state.json; fi
          if [ -f daily_snapshot.json ]; then git add daily_snapshot.json; fi
          if [ -f jgb_history.json ]; then git add jgb_history.json; fi
          if [ -f jgb_history_error.txt ]; then git add jgb_history_error.txt; fi
          if [ -f history_us.json ]; then git add history_us.json; fi
          if [ -f history_us_error.txt ]; then git add history_us_error.txt; fi
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
